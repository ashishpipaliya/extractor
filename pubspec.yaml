name: extractor
description: A robust Flutter plugin for downloading videos and audio from 1000+ websites using yt-dlp. Features quality selection, format conversion, progress tracking, and more.
version: 1.0.0
homepage: https://github.com/ashishpipaliya/extractor
repository: https://github.com/ashishpipaliya/extractor
issue_tracker: https://github.com/ashishpipaliya/extractor/issues

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^1.0.0
  pigeon: ^22.7.0

flutter:
  plugin:
    platforms:
      android:
        package: com.ashishpipaliya.extractor
        pluginClass: ExtractorPlugin
